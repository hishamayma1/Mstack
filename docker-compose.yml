# MStack360 website (Next.js 16 + Payload CMS) for a VPS.
#
#   1. Copy .env.example to .env and fill it in (DATABASE_URI, PAYLOAD_SECRET,
#      NEXT_PUBLIC_SERVER_URL=https://your-domain, SMTP, VAPID, UPLOADTHING_TOKEN).
#   2. docker compose up -d --build
#
# The app listens on 127.0.0.1:3000 — put Nginx/Caddy in front for HTTPS.

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - app_env
    image: mstack360-website:latest
    container_name: mstack360-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Payload's local upload dir (media goes to UploadThing, this is a fallback)
      - media:/app/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  app_env:
    file: ./.env

volumes:
  media:
